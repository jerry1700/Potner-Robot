# potner_llm 설정 예시
# API 키는 코드/깃에 넣지 말고 환경변수(.env)로 주입:
#   GMS_API_KEY=...      (권장 — plant-robot-chat 웹 테스트 앱과 같은 변수명/값을 공유한다)
#   OPENAI_API_KEY=...   (GMS_API_KEY보다 이 이름이 우선 적용됨)
#   OPENAI_BASE_URL=...  (선택)
#   OPENAI_MODEL=...     (선택)
#   OPENAI_MAX_TOKENS=... (선택)
#   OPENAI_MAX_RETRIES=...            (선택, 429/5xx 재시도 횟수)
#   OPENAI_RETRY_BACKOFF_SECONDS=...  (선택, 재시도 대기 시간의 기준값. 2배씩 증가)

llm:
  enabled: true
  provider: anthropic    # anthropic | gms | openai | mock
  # GMS Anthropic 프록시 allowlist: claude-opus-4-8 / 4-7 / 4-6, claude-sonnet-4-6
  # (claude-opus-5 등 5 계열은 아직 없음 → 400). temperature는 보내면 400이라
  # 클라이언트가 아예 보내지 않는다 — 톤은 시스템 프롬프트로 제어.
  model: claude-opus-4-8
  # 한글은 토큰 단가가 높고 tool_use JSON도 출력 토큰을 먹는다 — 200이면 잘림.
  max_tokens: 400
  max_retries: 2
  retry_backoff_seconds: 0.5
  api_key_env: OPENAI_API_KEY   # 없으면 GMS_API_KEY 폴백 (키는 GMS 하나로 공용)
  base_url: https://gms.ssafy.io/gmsapi/api.anthropic.com
  # 이전 설정 (OpenAI 프록시로 롤백할 때):
  #   provider: gms / model: gpt-4.1-nano / max_tokens: 200
  #   base_url: https://gms.ssafy.io/gmsapi/api.openai.com/v1

# 대화 이력 저장/복원 설정.
# 한 대화가 끝나면(DialogueService.end_conversation()) 여기 저장하고,
# 다음 대화 시작 시(DialogueService 생성) 여기서 불러와 이어간다.
# base_url은 코드/깃에 넣지 말고 CONVERSATION_BASE_URL 환경변수로 주입 가능.
conversation:
  backend: file            # file | http (http = Spring 백엔드 등 실제 서버)
  session_id: potner-01    # mqtt_bridge의 device_id와 맞추면 기기별 구분이 쉬움
  file_path: ""            # backend=file일 때. 비워두면 호출자의 default_dir 사용
                            # (cli.py는 src/potner_llm/data/conversation_history.json).
                            # 상대경로를 직접 쓰면 실행한 위치(cwd) 기준이 되니 주의.
  base_url: ""              # backend=http일 때 예: http://localhost:8080/api
  timeout_seconds: 10

# 웹 조회 — LLM이 "내일 날씨 어때?"(Open-Meteo), "잎이 왜 노래져?"(위키백과),
# "요즘 뉴스 뭐 있어?"(Google News RSS)에 실제 웹 정보로 답하게 한다.
# 전부 키가 필요 없는 공개 API. enabled: false면 툴이 비활성 안내로 답한다.
web:
  enabled: true
  latitude: 35.09     # 로봇 위치 (부산 강서구 녹산) — 시연 장소에 맞게 조정
  longitude: 128.85
  timeout_seconds: 8
  news_limit: 5

# 센서 조회 — LLM이 "지금 온도/습도 어때?" 같은 질문에 실측값으로 답하게 한다.
# 기본은 none(연동 안 함 → 호출부가 sensors.json 파일 기반 데모로 폴백).
# 온습도는 라즈베리 스테이션(DHT11)만 재고 로봇엔 센서가 없으므로, 서버의
# 센서 조회 API를 거쳐야 한다 — 인증 방식은 서버팀 확인 대기 중
# (docs/SERVER_REQUEST_SENSOR_AUTH.md, docs/LLM_SENSOR_INTEGRATION_PLAN.md).
# 확정되면 아래를 채우고 source: spring으로 켠다.
sensor:
  source: none              # none | file | http | spring
  # spring일 때:
  # url: http://i15e104.p.ssafy.io/api/v1/plants/{plantId}/sensors/current
  # token_header: X-Device-Token    # 서버팀 답변에 따라 Authorization일 수도 있음
  # token_env: POTNER_SENSOR_TOKEN  # 값은 .env로, yaml엔 이름만
  # timeout_seconds: 5
