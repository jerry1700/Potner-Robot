# slam_toolbox — LiDAR 스캔으로 집 지도를 만듭니다.
#
# 대부분 기본값을 그대로 쓰되, 실내 소형 로봇에 맞게 몇 가지만 조정했습니다.

slam_toolbox:
  ros__parameters:
    # ---- 좌표계. URDF와 base_driver가 만드는 이름과 반드시 일치해야 합니다.
    odom_frame: odom
    map_frame: map
    base_frame: base_footprint
    scan_topic: /scan

    mode: mapping

    # ---- 해상도. 집 안은 좁아서 5cm 격자면 충분합니다.
    resolution: 0.05

    # YDLIDAR X4 Pro의 유효 거리. 실내에서는 8m 이상 쓸 일이 없고,
    # 멀리 있는 부정확한 점을 넣으면 지도가 지저분해집니다.
    max_laser_range: 8.0

    # ---- 갱신 조건. 이 정도 움직여야 스캔을 한 번 더 씁니다.
    minimum_travel_distance: 0.2
    minimum_travel_heading: 0.2
    transform_publish_period: 0.02
    map_update_interval: 2.0

    # ---- 루프 클로저. 한 바퀴 돌아 제자리에 왔을 때 지도를 맞춰줍니다.
    do_loop_closing: true
    loop_search_maximum_distance: 3.0
    loop_match_minimum_response_fine: 0.45
