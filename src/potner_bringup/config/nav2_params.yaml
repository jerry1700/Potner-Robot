# Nav2 파라미터.
#
# nav2_bringup 의 기본 설정을 그대로 쓰되, Potner에 맞춰 반드시 바꿔야 하는
# 항목만 여기 모았습니다. 전체 기본값은 아래에서 확인할 수 있습니다:
#   /opt/ros/humble/share/nav2_bringup/params/nav2_params.yaml
#
# ★ 이 파일은 최소 골격입니다. 실주행 전에 위 기본 파일을 복사해 와서
#   아래 항목들을 덮어쓰는 형태로 완성하세요.

amcl:
  ros__parameters:
    base_frame_id: base_footprint
    odom_frame_id: odom
    global_frame_id: map
    scan_topic: scan

    # 차동 구동 로봇의 오차 모델. 애커만과 다릅니다.
    robot_model_type: "nav2_amcl::DifferentialMotionModel"

    # TODO: 실주행 후 오차를 보고 조정. 로봇이 자꾸 위치를 잃으면 키우고,
    #       추정이 너무 출렁이면 줄입니다.
    alpha1: 0.2   # 회전 중 회전 오차
    alpha2: 0.2   # 직진 중 회전 오차
    alpha3: 0.2   # 직진 중 직진 오차
    alpha4: 0.2   # 회전 중 직진 오차

    laser_max_range: 8.0
    max_particles: 2000
    min_particles: 500

controller_server:
  ros__parameters:
    # Nav2의 출력을 twist_mux 로 보냅니다. 이걸 cmd_vel 로 두면
    # 안전 노드를 건너뛰고 모터로 직행합니다.
    odom_topic: odom
    FollowPath:
      # TODO: DWB 파라미터를 로봇 실측 속도에 맞출 것
      max_vel_x: 0.22
      min_vel_x: 0.0
      max_vel_theta: 0.8
      acc_lim_x: 0.5
      acc_lim_theta: 1.5

local_costmap:
  local_costmap:
    ros__parameters:
      global_frame: odom
      robot_base_frame: base_footprint
      # TODO: 본체 외경 실측값의 절반 + 여유
      robot_radius: 0.14
      resolution: 0.05
      observation_sources: scan
      scan:
        topic: /scan
        max_obstacle_height: 2.0
        clearing: true
        marking: true
        data_type: "LaserScan"

global_costmap:
  global_costmap:
    ros__parameters:
      global_frame: map
      robot_base_frame: base_footprint
      robot_radius: 0.14
      resolution: 0.05
      observation_sources: scan
      scan:
        topic: /scan
        max_obstacle_height: 2.0
        clearing: true
        marking: true
        data_type: "LaserScan"
